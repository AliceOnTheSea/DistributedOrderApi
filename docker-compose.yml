version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distributed-order-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=DistributedOrderDb;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;
      - VendorApi__BaseUrl=http://localstack:4566
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: distributed-order-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: distributed-order-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns,dynamodb
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  sqlserver-data:
